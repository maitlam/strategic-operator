name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check provenance labels, sources.json, and catalog
        run: python3 scripts/catalog.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate marketplace and plugins with Claude Code
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          for plugin in plugins/*/; do
            npx --yes @anthropic-ai/claude-code plugin validate "$plugin"
          done
